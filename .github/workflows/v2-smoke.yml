name: Maths Desk V2 checks
on:
  push:
    branches: [main, feature/maths-desk-v2-learning-engine]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v2-smoke.mjs
